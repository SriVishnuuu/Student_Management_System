<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course - Student Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div class="bg-dark text-white" id="sidebar-wrapper">

        <div class="sidebar-heading border-bottom border-secondary">
            <i class="bi bi-mortarboard-fill me-2"></i> SMS Admin
        </div>

        <div class="list-group list-group-flush">

            <a th:href="@{/dashboard}" class="sidebar-link">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>

            <a th:href="@{/courses/list}" class="sidebar-link active">
                <i class="bi bi-book"></i> Courses
            </a>

            <a th:href="@{/students/list}" class="sidebar-link">
                <i class="bi bi-people"></i> Students
            </a>

            <a th:href="@{/enrollments/list}" class="sidebar-link">
                <i class="bi bi-check2-square"></i> Enrolled Students
            </a>

            <a th:href="@{/enrollments}" class="sidebar-link">
                <i class="bi bi-check2-square"></i> Enroll to Course
            </a>

            <a th:href="@{/logout}" class="sidebar-link mt-auto border-top border-secondary">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>

        </div>

    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">

            <div class="container-fluid">

                <button class="btn btn-outline-secondary" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <div class="ms-auto d-flex align-items-center">

                        <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center"
                             style="width:40px; height:40px;">

                            <i class="bi bi-person-fill fs-5"></i>

                        </div>

                        <div class="ms-2">

                            <h6 class="mb-0 fw-bold">Admin User</h6>

                        </div>

                    </div>

                </div>

            </div>

        </nav>

        <!-- Main Content -->

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>Add New Course</h2>

                <a th:href="@{/courses/list}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to List
                </a>

            </div>

            <div class="card mb-4">

                <div class="card-header bg-white">

                    <i class="bi bi-plus-circle me-1"></i>

                    Course Details

                </div>

                <div class="card-body">

                    <form th:action="@{/courses}" th:object="${courseDto}" method="post" novalidate>

                        <div class="row mb-3">

                            <div class="col-md-6">

                                <label for="courseName" class="form-label">
                                    Course Name
                                </label>

                                <input
                                        type="text"
                                        th:field="*{courseName}"
                                        class="form-control"
                                        id="courseName"
                                        name="courseName"
                                        placeholder="e.g. Web Development"
                                        th:classappend="${#fields.hasErrors('courseName')} ? ' is-invalid' : ''"
                                        required>
                                        <div class="invalid-feedback"
                                            th:if="${#fields.hasErrors('courseName')}"
                                            th:errors="*{courseName}">
                                        </div>
                            </div>

                            <div class="col-md-6">

                                <label for="courseCode" class="form-label">
                                    Course Code
                                </label>

                                <input
                                        type="text"
                                        th:field="*{courseCode}"
                                        class="form-control"
                                        th:classappend="${#fields.hasErrors('courseCode')} ? ' is-invalid' : ''"
                                        id="courseCode"
                                        placeholder="e.g. WEB101"
                                        required>

                                <div class="invalid-feedback"
                                     th:errors="*{courseCode}">
                                </div>

                            </div>

                        <div class="row mb-3">

                            <div class="col-md-6">

                                <label for="duration" class="form-label">
                                    Duration
                                </label>

                                <input
                                        type="text"
                                        th:field="*{duration}"
                                        class="form-control"
                                        id="duration"
                                        name="duration"
                                        placeholder="e.g. 6 Months"
                                        th:classappend="${#fields.hasErrors('duration')} ? ' is-invalid' : ''"
                                        required>
                                        <div class="invalid-feedback"
                                             th:if="${#fields.hasErrors('duration')}"
                                             th:errors="*{duration}">
                                        </div>

                            </div>

                            <div class="col-md-6">

                                <label for="courseFee" class="form-label">
                                    Course Fee
                                </label>

                                <input
                                        type="number"
                                        th:field="*{fee}"
                                        step="0.01"
                                        min="0"
                                        class="form-control"
                                        id="courseFee"
                                        placeholder="e.g. 1200"
                                        th:classappend="${#fields.hasErrors('fee')} ? ' is-invalid' : ''"
                                        required>
                                        <div class="invalid-feedback"
                                             th:if="${#fields.hasErrors('fee')}"
                                             th:errors="*{fee}">
                                        </div>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="description" class="form-label">
                                Description
                            </label>

                            <textarea
                                    class="form-control"
                                    th:field="*{description}"
                                    id="description"
                                    name="description"
                                    th:classappend="${#fields.hasErrors('description')} ? ' is-invalid' : ''"
                                    rows="4"
                                    placeholder="Enter course description..."></textarea>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('description')}"
                                         th:errors="*{description}">
                                    </div>

                        </div>

                        <div class="d-flex justify-content-end">

                            <button type="reset" class="btn btn-light me-2">
                                Reset
                            </button>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>
                                Save Course
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Sidebar Toggle -->
<script>

    window.addEventListener('DOMContentLoaded', () => {

        const sidebarToggle = document.getElementById('sidebarToggle');

        if (sidebarToggle) {

            sidebarToggle.addEventListener('click', e => {

                e.preventDefault();

                document.body.classList.toggle('sb-sidenav-toggled');

            });

        }

    });

</script>

</body>

</html>
