<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div class="bg-dark text-white" id="sidebar-wrapper">

        <div class="sidebar-heading border-bottom border-secondary">
            <i class="bi bi-mortarboard-fill me-2"></i> SMS Admin
        </div>

        <div class="list-group list-group-flush">

            <a th:href="@{/dashboard}" class="sidebar-link">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>

            <a th:href="@{/courses/list}" class="sidebar-link">
                <i class="bi bi-book"></i> Courses
            </a>

            <a th:href="@{/students/list}" class="sidebar-link active">
                <i class="bi bi-people"></i> Students
            </a>


            <a th:href="@{/enrollments/list}" class="sidebar-link">
                <i class="bi bi-check2-square"></i> Enrolled Students
            </a>

            <a th:href="@{/enrollments}" class="sidebar-link">
                <i class="bi bi-check2-square"></i> Enroll to Course
            </a>

            <a th:href="@{/logout}"
               class="sidebar-link mt-auto border-top border-secondary">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>

        </div>

    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">

            <div class="container-fluid">

                <button class="btn btn-outline-secondary" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <div class="ms-auto d-flex align-items-center">

                        <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center"
                             style="width:40px; height:40px;">

                            <i class="bi bi-person-fill fs-5"></i>

                        </div>

                        <div class="ms-2">

                            <h6 class="mb-0 fw-bold">Admin User</h6>

                        </div>

                    </div>

                </div>

            </div>

        </nav>

        <!-- Main Content -->
        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>Students</h2>

                <a th:href="@{/students/add}"
                   class="btn btn-primary">

                    <i class="bi bi-plus-lg me-1"></i>
                    Add New Student

                </a>

            </div>

            <!-- Success Message -->

            <div class="alert alert-success alert-dismissible fade show"
                 th:if="${message}">

                <span th:text="${message}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>

            <!-- Student Table -->

            <div class="card mb-4">

                <div class="card-header bg-white">
                    <i class="bi bi-table me-1"></i>
                    Student List
                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover table-striped">

                            <thead>

                            <tr>

                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Actions</th>

                            </tr>

                            </thead>

                            <tbody>

                            <!-- Display when no students are available -->

                            <tr th:if="${students.empty}">

                                <td colspan="5"
                                    class="text-center">

                                    No Students Found

                                </td>

                            </tr>
                            <!-- Student List -->

                            <tr th:each="student : ${students.content}">

                                <td data-label="ID"
                                    th:text="${student.id}">
                                </td>

                                <td data-label="Name"
                                    th:text="${student.firstName + ' ' + student.lastName}">
                                </td>

                                <td data-label="Email"
                                    th:text="${student.email}">
                                </td>

                                <td data-label="Phone"
                                    th:text="${student.phone}">
                                </td>

                                <td data-label="Actions">

                                    <!-- View -->

                                    <a th:href="@{/students/view/{id}(id=${student.id})}"
                                       class="btn btn-sm btn-info text-white me-1"
                                       title="View">

                                        <i class="bi bi-eye"></i>

                                    </a>

                                    <!-- Edit -->

                                    <a th:href="@{/students/edit/{id}(id=${student.id})}"
                                       class="btn btn-sm btn-warning text-white me-1"
                                       title="Edit">

                                        <i class="bi bi-pencil"></i>

                                    </a>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>
                    <!-- Pagination -->
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <div>
                                    <span class="text-muted">
                                        Total Students:
                                        <strong th:text="${students.totalElements}"></strong>
                                    </span>
                        </div>

                        <nav th:if="${students.totalPages > 1}"
                             aria-label="Student pagination">

                            <ul class="pagination justify-content-end">

                                <!-- Previous -->

                                <li class="page-item"
                                    th:classappend="${students.first} ? 'disabled'">

                                    <a class="page-link"
                                       th:href="@{/students/list(page=${students.number-1},size=${students.size})}">

                                        Previous

                                    </a>

                                </li>

                                <!-- Page Numbers -->

                                <li class="page-item"
                                    th:each="pageNumber : ${#numbers.sequence(0, students.totalPages-1)}"
                                    th:classappend="${pageNumber == students.number} ? 'active'">

                                    <a class="page-link"
                                       th:text="${pageNumber+1}"
                                       th:href="@{/students/list(page=${pageNumber},size=${students.size})}">
                                    </a>

                                </li>

                                <!-- Next -->

                                <li class="page-item"
                                    th:classappend="${students.last} ? 'disabled'">

                                    <a class="page-link"
                                       th:href="@{/students/list(page=${students.number+1},size=${students.size})}">

                                        Next

                                    </a>

                                </li>

                            </ul>

                        </nav>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

    window.addEventListener('DOMContentLoaded', event => {

        const sidebarToggle = document.body.querySelector('#sidebarToggle');

        if (sidebarToggle) {

            sidebarToggle.addEventListener('click', event => {

                event.preventDefault();

                document.body.classList.toggle('sb-sidenav-toggled');

            });

        }

    });

</script>

</body>

</html>
