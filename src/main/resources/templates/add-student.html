<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div class="bg-dark text-white" id="sidebar-wrapper">

        <div class="sidebar-heading border-bottom border-secondary">
            <i class="bi bi-mortarboard-fill me-2"></i>
            SMS Admin
        </div>

        <div class="list-group list-group-flush">

            <a th:href="@{/dashboard}" class="sidebar-link">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a th:href="@{/courses/list}" class="sidebar-link">
                <i class="bi bi-book"></i>
                Courses
            </a>

            <a th:href="@{/students/list}" class="sidebar-link active">
                <i class="bi bi-people"></i>
                Students
            </a>

            <a th:href="@{/enrollments/list}" class="sidebar-link">
                <i class="bi bi-check2-square"></i> Enrolled Students
            </a>

            <a th:href="@{/enrollments}" class="sidebar-link">
                <i class="bi bi-check2-square"></i>
                Enroll to Course
            </a>

            <a th:href="@{/logout}" class="sidebar-link mt-auto border-top border-secondary">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">

            <div class="container-fluid">

                <button class="btn btn-outline-secondary" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <div class="ms-auto d-flex align-items-center">

                        <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center"
                             style="width:40px; height:40px;">

                            <i class="bi bi-person-fill fs-5"></i>

                        </div>

                        <div class="ms-2">

                            <h6 class="mb-0 fw-bold">Admin User</h6>

                        </div>

                    </div>

                </div>

            </div>

        </nav>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>Add New Student</h2>

                <a th:href="@{/students/list}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to List
                </a>

            </div>

            <div class="card mb-4">

                <div class="card-header bg-white">
                    <i class="bi bi-person-plus me-1"></i>
                    Student Details
                </div>

                <div class="card-body">

                    <form th:action="@{/students}"
                          th:object="${studentDto}"
                          method="post"
                          novalidate>

                        <!-- First Name & Last Name -->

                        <div class="row mb-3">

                            <div class="col-md-6">

                                <label class="form-label">
                                    First Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{firstName}"
                                       placeholder="e.g. John"
                                       th:classappend="${#fields.hasErrors('firstName')} ? ' is-invalid'">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('firstName')}"
                                     th:errors="*{firstName}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Last Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{lastName}"
                                       placeholder="e.g. Doe"
                                       th:classappend="${#fields.hasErrors('lastName')} ? ' is-invalid'">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('lastName')}"
                                     th:errors="*{lastName}">
                                </div>

                            </div>

                        </div>

                        <!-- Email & Phone -->

                        <div class="row mb-3">

                            <div class="col-md-6">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       placeholder="e.g. john@example.com"
                                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}">
                                </div>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{phone}"
                                       placeholder="e.g. +91 9876543210"
                                       th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('phone')}"
                                     th:errors="*{phone}">
                                </div>

                            </div>

                        </div>

                        <!-- Address -->

                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea class="form-control"
                                      rows="3"
                                      th:field="*{address}"
                                      placeholder="Enter full address..."
                                      th:classappend="${#fields.hasErrors('address')} ? ' is-invalid'">
                            </textarea>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('address')}"
                                 th:errors="*{address}">
                            </div>

                        </div>

                        <div class="d-flex justify-content-end">

                            <button type="reset"
                                    class="btn btn-light me-2">
                                Reset
                            </button>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-save me-1"></i>
                                Save Student

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    window.addEventListener('DOMContentLoaded', event => {
        const sidebarToggle = document.body.querySelector('#sidebarToggle');

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', event => {
                event.preventDefault();
                document.body.classList.toggle('sb-sidenav-toggled');
            });
        }
    });
</script>

</body>
</html>
