<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enroll Student to Courses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="d-flex" id="wrapper">

    <!-- Sidebar -->

    <div class="bg-dark text-white"
         id="sidebar-wrapper">

        <div class="sidebar-heading border-bottom border-secondary">

            <i class="bi bi-mortarboard-fill me-2"></i>

            SMS Admin

        </div>

        <div class="list-group list-group-flush">

            <a class="sidebar-link"
               th:href="@{/dashboard}">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a class="sidebar-link"
               th:href="@{/courses/list}">
                <i class="bi bi-book"></i>
                Courses
            </a>

            <a class="sidebar-link"
               th:href="@{/students/list}">
                <i class="bi bi-people"></i>
                Students
            </a>

            <a th:href="@{/enrollments/list}" class="sidebar-link">
                <i class="bi bi-check2-square"></i> Enrolled Students
            </a>

            <a class="sidebar-link active"
               th:href="@{/enrollments}">
                <i class="bi bi-check2-square"></i>
                Enroll to Course
            </a>

            <a class="sidebar-link mt-auto border-top border-secondary"
               th:href="@{/logout}">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

    </div>

    <!-- Page Content -->

    <div id="page-content-wrapper">

        <!-- Navbar -->

        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">

            <div class="container-fluid">

                <button class="btn btn-outline-secondary"
                        id="sidebarToggle">

                    <i class="bi bi-list"></i>

                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <div class="ms-auto d-flex align-items-center">

                        <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center"
                             style="width:40px; height:40px;">

                            <i class="bi bi-person-fill fs-5"></i>

                        </div>

                        <div class="ms-2">

                            <h6 class="mb-0 fw-bold">Admin User</h6>

                        </div>

                    </div>

                </div>

            </div>

        </nav>

        <div class="container-fluid px-4 py-4">

            <!-- Flash Messages -->

            <div class="alert alert-success"
                 th:if="${successMessage}"
                 th:text="${successMessage}">
            </div>

            <div class="alert alert-danger"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
            </div>

            <!-- Page Heading -->

            <div class="bg-primary text-white rounded-3 p-4 mb-4">

                <div class="d-flex justify-content-between align-items-center">

                    <h2 class="mb-0">

                        Enroll Student to Courses

                    </h2>

                    <a class="btn btn-light text-primary fw-semibold"
                       th:href="@{/students/list}">

                        <i class="bi bi-arrow-left me-1"></i>

                        Back to Students

                    </a>

                </div>

            </div>

            <!-- Enrollment Form -->

            <form th:action="@{/enrollments/enroll-course}"
                  method="post"
                  th:object="${enrollmentDto}">


                <div class="row g-4">

                    <!-- Left Side -->

                    <div class="col-lg-8">

                        <div class="card h-100">

                            <div class="card-header bg-white d-flex justify-content-between align-items-center">

                                <span>

                                    <i class="bi bi-list-check me-1"></i>

                                    Course Selection

                                </span>

                                <span class="text-muted small">

                                    Multi-select allowed

                                </span>

                            </div>

                            <div class="card-body">

                                <div class="table-responsive">

                                    <table class="table table-hover align-middle">

                                        <thead>

                                        <tr>

                                            <th style="width:60px">

                                                Select

                                            </th>

                                            <th>

                                                Course Name

                                            </th>

                                            <th class="text-end">

                                                Fee

                                            </th>

                                        </tr>

                                        </thead>

                                        <tbody>

                                        <tr th:each="course : ${courses}">

                                            <td data-label="Select">

                                                <div class="form-check">

                                                    <input
                                                            class="form-check-input"
                                                            type="checkbox"
                                                            th:field="*{courseIds}"
                                                            th:value="${course.id}"
                                                            th:data-name="${course.courseName}"
                                                            th:data-fee="${course.fee}"/>

                                                </div>

                                            </td>

                                            <td data-label="Course Name" th:text="${course.courseName}">
                                            </td>

                                            <td data-label="Fee" class="text-end"
                                                th:text="${'₹' + course.fee}">
                                            </td>

                                        </tr>

                                        </tbody>

                                    </table>

                                </div>

                            </div>

                        </div>

                    </div>
                    <!-- Right Side -->

                    <div class="col-lg-4">

                        <div class="card h-100">

                            <div class="card-header bg-white">

                                <i class="bi bi-person-check me-1"></i>

                                Student & Summary

                            </div>

                            <div class="card-body d-flex flex-column gap-3">
                                <div>
                                    <label for="studentSelect" class="form-label">Select Student</label>
                                    <select id="studentSelect" class="form-select mb-2" th:field="*{studentId}" th:classappend="${#fields.hasErrors('studentId')} ? 'is-invalid' : '' ">
                                        <option value="">Select a student</option>
                                        <option th:each="student : ${students}"
                                                th:value="${student.id}"
                                                th:data-name="${student.firstName + ' ' + student.lastName}"
                                                th:data-email="${student.email}"
                                                th:text="${student.firstName + ' ' + student.lastName + ' (' + student.email + ')'}">
                                        </option>
                                    </select>
                                    <div class="invalid-feedback"
                                         th:if="${#fields.hasErrors('studentId')}"
                                         th:errors="*{studentId}">
                                    </div>
                                    <div class="p-3 bg-light border rounded">
                                        <div class="text-muted small">Selected Student</div>
                                        <div class="fw-semibold mb-0" id="selectedStudent"></div>
                                        <div class="small text-muted" id="selectedEmail"></div>
                                    </div>
                                </div>

                                <div class="p-3 bg-light border rounded">
                                    <div class="d-flex justify-content-between mb-1">
                                        <span class="text-muted">Courses Selected</span>
                                        <strong id="selectedCourseCount">0</strong>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <span class="text-muted">Total Fee</span>
                                        <strong class="text-primary" id="totalFees"></strong>
                                    </div>
                                </div>

                                <div>
                                    <div class="text-muted small mb-1">Selected Courses</div>
                                    <ul class="list-group" id="selectedCourses">
                                        <li>No course selected</li>
                                    </ul>
                                </div>
                                <div class="d-flex flex-wrap gap-2">

                                    <button type="button" class="btn btn-outline-secondary flex-grow-1">
                                        <i class="bi bi-arrow-left me-1"></i>
                                        Cancel
                                    </button>

                                    <button type="submit" class="btn btn-primary flex-grow-1">
                                        <i class="bi bi-check2-circle me-1"></i>
                                        Enroll
                                    </button>

                                </div>
                            </div>
                        </div>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const studentSelect = document.getElementById("studentSelect");

    let countElement =
        document.getElementById("selectedCourseCount");

    let feeElement =
        document.getElementById("totalFees");

    const checkboxes =
        document.querySelectorAll("input[type='checkbox']");

    const selectedCourses =
        document.getElementById("selectedCourses");

    let count = 0;
    let total = 0;

    checkboxes.forEach(box => {
        box.addEventListener("change",updateSummary);
    });

    function updateSummary(){

        count = 0;
        total = 0;
        selectedCourses.innerHTML = "";

        checkboxes.forEach(box => {

            if(box.checked){

                count++;
                total += Number(box.dataset.fee);

                const li = document.createElement("li");

                li.className = "list-group-item";

                li.innerText = box.dataset.name;

                selectedCourses.appendChild(li);

            }

        });

        if (count === 0) {

            selectedCourses.innerHTML =
                "<li class='list-group-item text-muted'>No course selected</li>";

        }

        countElement.innerText = count;
        feeElement.innerText = "₹" + total;
    }


    window.addEventListener('DOMContentLoaded', () => {

        const sidebarToggle = document.getElementById('sidebarToggle');

        if (sidebarToggle) {

            sidebarToggle.addEventListener('click', e => {

                e.preventDefault();

                document.body.classList.toggle('sb-sidenav-toggled');

            });

        }

    });

    studentSelect.addEventListener("change", function () {

        const option = this.selectedOptions[0];

        document.getElementById("selectedStudent").innerText =
            option.dataset.name;

        document.getElementById("selectedEmail").innerText =
            option.dataset.email;

    });

</script>

</body>

</html>
